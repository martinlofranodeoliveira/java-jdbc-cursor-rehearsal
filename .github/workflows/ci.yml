name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - name: Ensure PostgreSQL binaries in PATH
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v initdb >/dev/null 2>&1; then
            for pg_dir in /usr/lib/postgresql/*/bin; do
              if [ -x "$pg_dir/initdb" ]; then
                echo "$pg_dir" >> "$GITHUB_PATH"
                break
              fi
            done
          fi

      - name: Build and run test suite
        run: mvn clean test package

      - name: Run rehearsal with assertions
        run: java -jar target/java-jdbc-cursor-rehearsal-0.1.0-standalone.jar --assert

      - name: Run rehearsal with JSON output
        run: java -jar target/java-jdbc-cursor-rehearsal-0.1.0-standalone.jar --json

      - name: Run offline test script
        run: /bin/sh scripts/test-offline.sh

      - name: Run offline demo script
        run: /bin/sh scripts/demo-offline.sh --assert
